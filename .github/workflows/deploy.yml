name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # keep the previous builds' hashed assets for 14 days: a browser holding a cached index.html
      # (Pages: max-age=600) must still find the bundle it names (tools/pages/retain_assets.mjs)
      - id: pages
        uses: actions/configure-pages@v5
      - run: node tools/pages/retain_assets.mjs "${{ steps.pages.outputs.base_url }}/" dist 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
